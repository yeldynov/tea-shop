<!--
  EmailJS template for the /contact form (src/app/contact/contact-form.tsx).
  Dashboard → Email Templates → Create:
    Settings → Template ID: template_contact
    Subject:   [Old Road] {{topic}} — {{name}}
    To Email:  your inbox
    Reply To:  {{email}}
    Content:   "Edit content" → code editor → paste everything below this comment.
-->
<div style="margin:0;padding:32px 16px;background:#f6f2e8;font-family:Georgia,'Times New Roman',serif;color:#1e2a1f;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#fbf8f1;border:1px solid rgba(30,42,31,0.14);border-radius:8px;">
    <tr>
      <td style="padding:28px 32px;border-bottom:1px solid rgba(30,42,31,0.14);">
        <p style="margin:0;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#3f6b45;font-family:Helvetica,Arial,sans-serif;">Old Road · 联系我们</p>
        <h1 style="margin:8px 0 0;font-size:26px;font-weight:normal;line-height:1.25;">A new message from {{name}}</h1>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 32px 8px;font-family:Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td style="padding:6px 0;width:120px;color:#7d8078;">From</td>
            <td style="padding:6px 0;">{{name}} &lt;<a href="mailto:{{email}}" style="color:#3f6b45;">{{email}}</a>&gt;</td>
          </tr>
          <tr>
            <td style="padding:6px 0;color:#7d8078;">About</td>
            <td style="padding:6px 0;">{{topic}}</td>
          </tr>
          <tr>
            <td style="padding:6px 0;color:#7d8078;">Order</td>
            <td style="padding:6px 0;">{{order}}</td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 32px 28px;">
        <div style="padding:20px;background:#dde5cf;border-radius:6px;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#1e2a1f;white-space:pre-wrap;">{{message}}</div>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 32px;">
        <a href="mailto:{{email}}" style="display:inline-block;padding:12px 22px;background:#3f6b45;color:#fbf8f1;text-decoration:none;border-radius:999px;font-family:Helvetica,Arial,sans-serif;font-size:14px;">Reply to {{name}}</a>
      </td>
    </tr>
  </table>
  <p style="max-width:560px;margin:16px auto 0;text-align:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#7d8078;">Sent from the contact form on Old Road.</p>
</div>
